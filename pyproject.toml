[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracemind"
version = "0.2.0"
description = "Evidence-grounded longitudinal understanding memory and evaluation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.10,<3", "typer>=0.15,<1", "psycopg[binary]>=3.2,<4", "jsonschema>=4,<5",
  "pgvector>=0.3,<1", "langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jinja2>=3.1,<4", "rank-bm25>=0.2,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
retrieval = ["transformers>=4.45,<5", "torch>=2.5,<3", "FlagEmbedding>=1.3,<2"]

[project.scripts]
tracemind = "tracemind.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tracemind"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/docs", "/README.md", "/pyproject.toml", "/uv.lock", "/data/examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires actual database or downloaded models"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
